<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Verification | ICAR Admin</title>
<link rel="stylesheet" href="index.css" />
<style>
  :root{
    --primary:#1e6f3f;
    --primary-dark:#154d2b;
    --accent:#f2a900;
    --bg:#f4f7f5;
    --card-bg:#ffffff;
    --text:#1b1f1d;
    --muted:#6b7570;
    --error:#c0392b;
    --success:#1e6f3f;
    --warn:#b7791f;
    --border:#dde3df;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  #loadingScreen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px;
    background:var(--bg); z-index:50;
  }
  .spinner-lg{
    width:36px; height:36px;
    border:3px solid var(--border);
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loadingScreen p{ color:var(--muted); font-size:14px; }

  #accessDenied{
    display:none;
    position:fixed; inset:0;
    align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
    background:var(--bg); text-align:center; padding:20px;
  }
  #accessDenied h2{ color:var(--error); margin:0; }
  #accessDenied p{ color:var(--muted); margin:0; }
  #accessDenied a{ color:var(--primary); font-weight:700; margin-top:10px; }

  .topbar{
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  .topbar .brand{ font-size:18px; font-weight:800; color:var(--primary-dark); text-decoration:none; }
  .topbar .brand span{ color:var(--accent); }
  .back-link{ font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; }
  .back-link:hover{ color:var(--primary); }

  .container{ max-width:900px; margin:0 auto; padding:28px 20px 60px; }

  .page-title h1{ margin:0 0 4px; font-size:22px; }
  .page-title p{ margin:0 0 20px; color:var(--muted); font-size:14px; }

  .tabs{
    display:flex; gap:6px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:4px;
    margin-bottom:20px;
    max-width:340px;
  }
  .tab-btn{
    flex:1; padding:9px 0; border:none; background:transparent;
    border-radius:8px; font-size:13px; font-weight:700;
    color:var(--muted); cursor:pointer; transition:all .15s ease;
  }
  .tab-btn.active{ background:var(--primary); color:#fff; }

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
    font-size:14px;
  }

  .payment-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .payment-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .payment-email{ font-weight:700; font-size:14.5px; }
  .payment-date{ font-size:12px; color:var(--muted); }

  .status-pill{
    font-size:11px; font-weight:800;
    padding:3px 10px; border-radius:20px;
    text-transform:uppercase; letter-spacing:0.3px;
    white-space:nowrap;
  }
  .status-pill.pending{ background:#fff3d6; color:var(--warn); }
  .status-pill.approved{ background:#dff2e6; color:var(--success); }
  .status-pill.rejected{ background:#fbe3e0; color:var(--error); }

  .payment-details{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
    font-size:13px;
    background:var(--bg);
    border-radius:8px;
    padding:12px 14px;
  }
  .payment-details .label{ color:var(--muted); font-size:11px; text-transform:uppercase; }
  .payment-details .value{ font-weight:700; margin-top:2px; }

  .reject-note{
    font-size:13px;
    color:var(--error);
    background:#fdecea;
    padding:8px 12px;
    border-radius:8px;
  }

  .action-row{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-approve{ background:var(--primary); color:#fff; }
  .btn-approve:hover{ background:var(--primary-dark); }
  .btn-reject{ background:#fff; color:var(--error); border:1px solid var(--error); }
  .btn-reject:hover{ background:#fdecea; }

  .rows-hidden{ display:none !important; }

  @media (max-width:520px){
    .topbar{ padding:12px 16px; }
    .container{ padding:20px 16px 50px; }
  }
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner-lg"></div>
  <p>Checking access...</p>
</div>

<div id="accessDenied">
  <h2>Access Denied</h2>
  <p>You don't have permission to view this page.</p>
  <a href="dashboard.html">&larr; Back to Dashboard</a>
</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <a href="dashboard.html" class="brand">ICAR <span>Test Series</span></a>
    <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="page-title">
      <h1>Payment Verification</h1>
      <p>Review student payment submissions and approve or reject access.</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pending" id="tabPending">Pending</button>
      <button class="tab-btn" data-tab="history" id="tabHistory">History</button>
    </div>

    <div id="pendingList"></div>
    <div id="historyList" class="rows-hidden"></div>

    <div class="empty-state" id="emptyPending" style="display:none;">No pending payments right now. 🎉</div>
    <div class="empty-state rows-hidden" id="emptyHistory">No reviewed payments yet.</div>
  </div>

</div>

<script type="module">
  import { app } from "./firebase-config.js";
  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    collection,
    query,
    where,
    orderBy,
    getDocs,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const auth = getAuth(app);
  const db = getFirestore(app);

  const loadingScreen = document.getElementById("loadingScreen");
  const accessDenied = document.getElementById("accessDenied");
  const appEl = document.getElementById("app");

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "auth.html";
      return;
    }

    try {
      const userSnap = await getDoc(doc(db, "users", user.uid));
      const userData = userSnap.exists() ? userSnap.data() : {};

      if (userData.role !== "admin") {
        loadingScreen.style.display = "none";
        accessDenied.style.display = "flex";
        return;
      }

      await loadPayments();
      loadingScreen.style.display = "none";
      appEl.style.display = "block";

    } catch (err) {
      console.error("Access check failed:", err);
      loadingScreen.querySelector("p").textContent = "Something went wrong. Please refresh.";
    }
  });

  // ---------- Tabs ----------
  const tabPending = document.getElementById("tabPending");
  const tabHistory = document.getElementById("tabHistory");
  const pendingList = document.getElementById("pendingList");
  const historyList = document.getElementById("historyList");
  const emptyPending = document.getElementById("emptyPending");
  const emptyHistory = document.getElementById("emptyHistory");

  tabPending.addEventListener("click", () => switchTab("pending"));
  tabHistory.addEventListener("click", () => switchTab("history"));

  function switchTab(tab){
    const isPending = tab === "pending";
    tabPending.classList.toggle("active", isPending);
    tabHistory.classList.toggle("active", !isPending);
    pendingList.classList.toggle("rows-hidden", !isPending);
    historyList.classList.toggle("rows-hidden", isPending);
    emptyPending.classList.toggle("rows-hidden", !isPending);
    emptyHistory.classList.toggle("rows-hidden", isPending);
  }

  // ---------- Load & render payments ----------
  async function loadPayments(){
    pendingList.innerHTML = "";
    historyList.innerHTML = "";

    const paymentsRef = collection(db, "payments");
    const snap = await getDocs(query(paymentsRef, orderBy("createdAt", "desc")));

    let pendingCount = 0;
    let historyCount = 0;

    snap.forEach((docSnap) => {
      const data = docSnap.data();
      const card = buildCard(docSnap.id, data);

      if (data.status === "pending") {
        pendingList.appendChild(card);
        pendingCount++;
      } else {
        historyList.appendChild(card);
        historyCount++;
      }
    });

    emptyPending.style.display = pendingCount === 0 ? "block" : "none";
    emptyHistory.style.display = historyCount === 0 ? "block" : "none";
  }

  function formatDate(timestamp){
    if (!timestamp || !timestamp.toDate) return "—";
    return timestamp.toDate().toLocaleString("en-IN", {
      day: "numeric", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function buildCard(paymentId, data){
    const card = document.createElement("div");
    card.className = "payment-card";

    const statusClass = data.status || "pending";

    card.innerHTML = `
      <div class="payment-top">
        <div>
          <div class="payment-email">${escapeHtml(data.email || "Unknown")}</div>
          <div class="payment-date">${formatDate(data.createdAt)}</div>
        </div>
        <span class="status-pill ${statusClass}">${statusClass}</span>
      </div>
      <div class="payment-details">
        <div>
          <div class="label">Plan</div>
          <div class="value">${escapeHtml(data.planName || "—")}</div>
        </div>
        <div>
          <div class="label">Amount</div>
          <div class="value">₹${escapeHtml(String(data.amount ?? "—"))}</div>
        </div>
        <div>
          <div class="label">UTR / Reference ID</div>
          <div class="value">${escapeHtml(data.utr || "—")}</div>
        </div>
      </div>
      ${data.status === "rejected" && data.reviewNote ? `<div class="reject-note">Reason: ${escapeHtml(data.reviewNote)}</div>` : ""}
      ${data.status === "pending" ? `
        <div class="action-row">
          <button class="btn btn-approve" data-action="approve" data-id="${paymentId}">Approve</button>
          <button class="btn btn-reject" data-action="reject" data-id="${paymentId}">Reject</button>
        </div>
      ` : ""}
    `;
    return card;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Approve / Reject actions ----------
  document.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;

    const paymentId = btn.dataset.id;
    const action = btn.dataset.action;

    const row = btn.closest(".payment-card");
    const allButtons = row.querySelectorAll("button");
    allButtons.forEach(b => b.disabled = true);

    try {
      if (action === "approve") {
        await updateDoc(doc(db, "payments", paymentId), {
          status: "approved",
          reviewedAt: serverTimestamp()
        });
        await updateDoc(doc(db, "users", paymentId), {
          premium: true,
          premiumSince: serverTimestamp()
        });
      } else if (action === "reject") {
        const reason = prompt("Reason for rejection (shown to the student):", "Payment details could not be verified.");
        if (reason === null) {
          allButtons.forEach(b => b.disabled = false);
          return;
        }
        await updateDoc(doc(db, "payments", paymentId), {
          status: "rejected",
          reviewNote: reason,
          reviewedAt: serverTimestamp()
        });
      }

      await loadPayments();
      switchTab(document.querySelectorAll(".rows-hidden").length ? "pending" : "pending");

    } catch (err) {
      console.error("Action failed:", err);
      alert("Failed to update this payment. Check your Firestore rules allow admin updates.");
      allButtons.forEach(b => b.disabled = false);
    }
  });
</script>

</body>
</html>
